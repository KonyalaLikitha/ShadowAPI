<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <title>ShadowAPI Panel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="header">
    <h2>ShadowAPI Control Panel</h2>

<div class="header-controls">
  <div class="mode-badge" id="modeBadge"></div>

  <button id="toggle" class="btn btn-primary">
    Switch Mode
  </button>

  <button id="clear" class="btn btn-secondary">
    Clear Logs
  </button>

  <button id="collapse" class="btn btn-secondary">
    Collapse Logs
  </button>
</div>

  </div>

  <div class="stats">
    <span>Total Requests: <span id="requestCount">0</span></span>
  </div>

  <div class="summary">
    <h3>Endpoint Usage</h3>
    <ul id="endpointSummary"></ul>
  </div>

  <div class="search">
    <input
      type="text"
      id="searchInput"
      placeholder="Search requests..."
    />
  </div>

  <div id="logs"></div>

  <script src="panel.js"></script>

</body>
</html>
